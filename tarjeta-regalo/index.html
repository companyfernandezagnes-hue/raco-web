  $("condT").textContent=t.condT;$("condL").innerHTML=t.cond.map(function(c){return c==="@@LINK@@"?"<li style=\"list-style:none;margin-left:-18px;margin-top:8px\"><a href=\""+PDFS[st.lang]+"\" target=\"_blank\" rel=\"noopener\" download><b>"+t.pdfLink+"</b></a></li>":"<li>"+c+"</li>";}).join("");
  $("acceptT").innerHTML=t.accept.replace("{c}","<a href=\""+PDFS[st.lang]+"\" target=\"_blank\" rel=\"noopener\">"+t.acceptC+"</a>").replace("{p}","<a href=\"/privacidad.html\" target=\"_blank\" rel=\"noopener\">"+t.acceptP+"</a>");$("lCard").textContent=t.lCard;$("cFromL").textContent=t.cFrom;$("cCodeL").textContent=t.code;
  $("amtLbl").textContent=t.amtLbl;$("amtErr").textContent=t.amtErr;$("secure").textContent=t.secure;$("mCard").textContent=t.mCard;
  renderMenus();renderDesigns();renderChips();
  if(!$("msg").dataset.touched){$("msg").value=DESIGNS[st.dz].msgs[l][0];}
  render();
}

function renderMenus(){
  var w=$("menus");w.innerHTML="";
  [50,100,150].forEach(function(a){
    var b=document.createElement("button");b.type="button";b.className="menu";b.setAttribute("aria-pressed",(!st.custom&&st.amount===a));
    b.innerHTML='<span class="dot"></span><div class="price">'+a+' €</div>';
    b.onclick=function(){st.custom=false;st.amount=a;$("amt").value="";renderMenus();render();};
    w.appendChild(b);
  });
}

    var b=document.createElement("button");b.type="button";b.className="dz";b.setAttribute("aria-pressed",k===st.dz);

12 90.554688 26.355469 L 90.554688 60.664062 L 93.96875 60.664062 Z M 112.230469 13.554688 C 104.890625 13.554688 99.429688 19.015625 99.429688 26.527344 L 99.429688 125.871094 C 99.429688 133.382812 104.890625 138.847656 112.230469 138.847656 C 119.570312 138.847656 125.03125 133.382812 125.03125 125.871094 L 125.03125 26.527344 C 125.03125 19.015625 119.570312 13.554688 112.230469 13.554688 M 112.230469 16.796875 C 117.691406 16.796875 121.449219 20.550781 121.449219 26.527344 L 121.449219 125.871094 C 121.449219 131.847656 117.691406 135.601562 112.230469 135.601562 C 106.769531 135.601562 103.011719 131.847656 103.011719 125.871094 L 103.011719 26.527344 C 103.011719 20.550781 106.769531 16.796875 112.230469 16.796875"/><path fill="currentColor" d="M 135.0625 27.785156 L 135.0625 2.617188 L 109.554688 2.617188 L 109.554688 5.871094 L 131.46875 5.871094 L 131.46875 27.785156 Z"/></svg></div><span>'+d.name[st.lang]+'</span>';
    b.onclick=function(){st.dz=k;if(!$("msg").dataset.touched){$("msg").value=d.msgs[st.lang][0];}renderDesigns();renderChips();render();};
    w.appendChild(b);});
}

function renderChips(){var d=DESIGNS[st.dz];$("chips").innerHTML="";
  d.msgs[st.lang].forEach(function(m){var c=document.createElement("button");c.type="button";c.className="chip";c.textContent=m;
    c.onclick=function(){$("msg").value=m;$("msg").dataset.touched="";render();};$("chips").appendChild(c);});}

function render(){
  var t=T[st.lang],d=DESIGNS[st.dz],card=$("card");
  card.style.setProperty("--bg",d.bg);card.style.setProperty("--fg",d.fg);card.style.setProperty("--ac",d.ac);card.style.setProperty("--mu",d.mu);
  $("art").innerHTML='<g transform="'+(d.off||"translate(-6,40)")+'">'+d.art+'</g>';
  $("dzName").textContent=d.name[st.lang];$("cOcc").textContent=d.occ[st.lang];
  $("cTitle").textContent=t.cardTitle+($("to").value||"…");$("cFrom").textContent=$("from").value||"…";
  $("cMenu").textContent=t.cardLabel+" · "+fmtEur(total()||st.amount);
  $("cMsg").textContent=$("msg").value;$("cnt").textContent=$("msg").value.length;
  $("cValid").textContent=t.valid+validUntil();
  var tot=total();
  $("total").textContent=tot?fmtEur(tot):"—";
  $("totalSub").innerHTML=t.cardLabel+"<br>RACO";
  $("pay").textContent=t.pay+(tot?" "+fmtEur(tot):"");
  $("amtErr").style.display=(st.custom&&!customOk())?"block":"none";
  $("pay").disabled=!($("accept").checked&&tot>0);
}

// ---- Eventos ----
["to","from"].forEach(function(id){$(id).oninput=render;});
$("amt").oninput=function(){st.custom=($("amt").value!=="");renderMenus();render();};
$("msg").oninput=function(){$("msg").dataset.touched="1";render();};
$("accept").onchange=render;
document.querySelectorAll("#langs button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l);};});
document.querySelectorAll("#sendToggle button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("#sendToggle button").forEach(function(x){x.setAttribute("aria-pressed",x===b);});
  st.to=b.dataset.to;$("destFields").style.display=st.to==="recipient"?"block":"none";};});

function showErr(m){var e=$("err");e.textContent=m;e.style.display="block";}

$("pay").onclick=function(){
  var t=T[st.lang];$("err").style.display="none";
  var name=$("buyer").value.trim(),mail=$("buyerMail").value.trim(),dest=$("destMail").value.trim();
  var mailRe=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!name||!mailRe.test(mail)||(st.to==="recipient"&&!mailRe.test(dest))){showErr(t.missing);return;}
  if(st.to==="recipient"&&dest.toLowerCase()!==$("destMail2").value.trim().toLowerCase()){showErr(t.mismatch);return;}
  var body={menu_type:"importe",amount_eur:total(),language:st.lang,buyer_name:name,buyer_email:mail,
    recipient_name:$("to").value.trim()||undefined,
    recipient_email:st.to==="recipient"?dest:undefined,
    deliver_to:st.to==="recipient"?"recipient":"buyer",
    message:$("msg").value.trim()||undefined,occasion:st.dz,accept_terms:true};
  var btn=$("pay");btn.disabled=true;btn.textContent=t.sending;
  var post=function(b){return fetch(CFG.API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});};
  var withTimeout=function(pr,ms){return Promise.race([pr,new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},ms);})]);};
  post(body)
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
    .then(function(x){
      if(!x.ok||!x.j.url){throw new Error("create");}
      // Imagen de la tarjeta tal como la ve el comprador, con su codigo real (si falla, el PDF usa un diseno de reserva)
      var snap=Promise.resolve();
      if(window.html2canvas&&x.j.code){
        $("cCode").textContent=x.j.code.replace(/(.{4})(?=.)/g,"$1 ");
        snap=withTimeout((document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
          return html2canvas($("card"),{scale:3,backgroundColor:null,useCORS:true,logging:false});
        }).then(function(cv){
          return post({action:"attach_image",order_ref:x.j.order_ref,card_image:cv.toDataURL("image/png")});
        }),20000).catch(function(){});
      }
      return snap.then(function(){
        try{sessionStorage.setItem("raco_gift_lang",st.lang);}catch(e){}
        var f=document.createElement("form");f.method="POST";f.action=x.j.url;
        ["Ds_SignatureVersion","Ds_MerchantParameters","Ds_Signature"].forEach(function(k){
          var i=document.createElement("input");i.type="hidden";i.name=k;i.value=x.j[k];f.appendChild(i);});
        document.body.appendChild(f);f.submit();
      });
    })
    .catch(function(){showErr(t.errGen);render();});
};

var qs=new URLSearchParams(location.search).get("lang");
var nav=(navigator.language||"es").slice(0,2);
setLang(["es","ca","en"].indexOf(qs)>-1?qs:(["es","ca","en"].indexOf(nav)>-1?nav:"es"));
</script>
